<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
  <link rel="stylesheet" href="studentlog.css">
</head>

<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <form action="php/studentlogin.php" method="post">
      <label for="student-id"> Student Email:</label>
      <input type="text" id="student-id" name="email" placeholder="Enter your student Email" required>

      <label for="student-password">Password:</label>
      <input type="password" id="student_password" name="password" placeholder="Enter your Password" required>

      <button type="submit" name="btn">Login</button>

      <p class="forgot-password">
        <a href="#">Forgot Password?</a>
      </p>
    </form>
  </div>
</body>

</html>
