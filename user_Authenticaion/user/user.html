<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Choices</title>
  <style>
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a3636;
      min-height: 100vh;
      padding: 20px;
    }

    .choice-container {
      background: #264d4d;
      padding: 35px;
      border-radius: 12px;
      text-align: center;
      width: 400px;
      max-width: 100%;
      color: #fff;
    }

    .choice-container h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .choice-container p {
      margin-bottom: 20px;
    }

    /* Buttons */
    .choices {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .choice-button {
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      background: #4CAF50;
      color: #fff;
      transition: 0.3s;
    }

    .choice-button:hover {
      background: #45a049;
    }

    /* Tablet */
    @media (max-width: 768px) {
      .choices {
        flex-direction: column;
      }

      .choice-button {
        width: 66%;
        margin: 0 auto;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .choice-container {
        padding: 20px;
      }

      .choice-container h1 {
        font-size: 1.4rem;
      }

      .choice-container p {
        font-size: 14px;
      }
    }
  </style>

</head>

<body>
  <div class="login-wrapper">
    <div class="choice-container">
      <h1>Welcome to the Management System</h1>
      <p>Please select your login type:</p>

      <div class="choices">
        <a href="../student/studentlog.html" class="choice-button">Student Login</a>
        <a href="../Staff/stafflog.html" class="choice-button">Staff Login</a>
      </div>
    </div>
  </div>
</body>

</html>
