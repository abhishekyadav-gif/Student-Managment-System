<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* background: linear-gradient(135deg, #4c7cf6, #56d8cd); */
      background-color: #1a3636;

      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .container input[type="text"] {
      width: 80%;
      text-align: center;
      padding: 12px 20px;
      margin-bottom: 20px;
      border: 1px solid #fff;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 16px;
    }

    .container input[type="text"]::placeholder {
      color: #ddd;
    }

    .container button {
      width: 100%;
      padding: 12px 20px;
      background: #ff7eb9;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .container button:hover {
      background: #ff5c8a;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .container input[type="text"],
      .container button {
        font-size: 14px;
      }
    }
  </style>
</head>
</head>

<body>
  <form action="php/seachfdata.php" method="post">

    <div class="container">
      <h3>Search Staff Records</h3>
      <input type="text" placeholder="Enter Name" name="search" required>
      <br>
      <br>
      <button type="submit" name="btn">Search</button>
    </div>
  </form>
</body>

</html>
