<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="attendence.css">
</head>

<body>
  <div class="page">
    <div class="message">
      <!-- <h2>Welcome to Student Attendence System</h2> -->
      <img src="../image/att.avif" alt="img">
    </div>
    <form action="phpcode/attendence.php" method="POST">
      <H2>Add Attendence</H2>

      <label for="student-id">Student ID:</label>
      <input type="number" id="student-id" name="student_id" required placeholder="Enter ID">
      <br>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter Full Name">
      <br>

      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required>
      <br>

      <label for="status">Attendance Status:</label>
      <select id="status" name="status">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
        <option value="Late">Late</option>
        <option value="Leave">Leave</option>
      </select>
      <br>

      <label for="remarks">Remarks:</label>
      <input type="text" id="remarks" name="remarks">
      <br>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>

</html>
